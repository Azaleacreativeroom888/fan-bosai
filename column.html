<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>コラム | 木と石のあいだ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700;800&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --wood-dark:#3b2616;
  --wood:#7a4e2d;
  --wood-light:#b98a5e;
  --stone-dark:#4a4d50;
  --stone:#8c9093;
  --stone-light:#d6d7d5;
  --paper:#efeeeb;
  --ink:#2a2420;
  --serif:"Shippori Mincho","Hiragino Mincho ProN","Yu Mincho",serif;
  --sans:"Zen Kaku Gothic New","Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--sans);color:var(--ink);background:var(--paper);line-height:1.9;font-size:16px}
a{color:inherit}
a:focus-visible{outline:3px solid var(--wood-light);outline-offset:3px}

header{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px 24px;padding:14px 5vw;background:linear-gradient(90deg,var(--wood-dark) 0%,var(--wood-dark) 50%,var(--stone-dark) 50%,var(--stone-dark) 100%);color:var(--paper)}
.logo{font-family:var(--serif);font-weight:800;font-size:1.25rem;text-decoration:none;letter-spacing:.08em}
nav ul{display:flex;gap:6px;list-style:none;flex-wrap:wrap}
nav a{display:block;padding:6px 16px;text-decoration:none;font-weight:500;border-radius:2px}
nav a:hover,nav a[aria-current="page"]{background:var(--paper);color:var(--wood-dark)}

.page-title{position:relative;padding:48px 5vw;color:var(--paper);overflow:hidden}
.page-title::before,.page-title::after{content:"";position:absolute;inset:0}
.page-title::before{
  background:repeating-linear-gradient(98deg,var(--wood) 0 7px,#6b4226 7px 11px,var(--wood) 11px 22px,#855635 22px 25px,var(--wood) 25px 41px,#5e3a20 41px 43px);
  clip-path:polygon(0 0,60% 0,50% 100%,0 100%);
}
.page-title::after{background:linear-gradient(135deg,var(--stone),var(--stone-dark));clip-path:polygon(60% 0,100% 0,100% 100%,50% 100%)}
.page-title h1{position:relative;z-index:1;font-family:var(--serif);font-weight:800;font-size:clamp(2rem,6vw,3.4rem);letter-spacing:.12em;text-shadow:0 2px 0 rgba(0,0,0,.35)}
.page-title p{position:relative;z-index:1;text-shadow:0 1px 0 rgba(0,0,0,.4)}

main{max-width:900px;margin:0 auto;padding:24px 5vw 72px}
section{padding-top:48px}
h2{font-family:var(--serif);font-weight:700;font-size:1.6rem;margin-bottom:20px;padding-left:16px;border-left:8px solid var(--wood);position:relative}
h2::after{content:"";position:absolute;left:-8px;bottom:0;width:8px;height:50%;background:var(--stone)}

/* リンクボックス：左が木、右が石 */
.report-box{display:grid;grid-template-columns:1fr 1fr;text-decoration:none;color:var(--paper);border-radius:4px;overflow:hidden;box-shadow:0 5px 0 var(--wood-dark)}
.report-box .wood{padding:32px 28px;background:repeating-linear-gradient(98deg,var(--wood) 0 7px,#6b4226 7px 11px,var(--wood) 11px 22px,#855635 22px 25px,var(--wood) 25px 41px,#5e3a20 41px 43px)}
.report-box .stone{padding:32px 28px;background:linear-gradient(135deg,var(--stone),var(--stone-dark));display:flex;flex-direction:column;justify-content:center}
.report-box .tag{display:inline-block;font-size:.8rem;font-weight:700;border:1px solid var(--paper);padding:0 10px;margin-bottom:10px}
.report-box h3{font-family:var(--serif);font-weight:800;font-size:1.6rem;line-height:1.4;text-shadow:0 2px 0 rgba(0,0,0,.35)}
.report-box p{font-size:.95rem;text-shadow:0 1px 0 rgba(0,0,0,.35)}
.report-box .go{margin-top:14px;font-weight:700;font-family:var(--serif)}
.report-box:hover{outline:4px solid var(--wood-light);outline-offset:3px}
.report-box:hover .go{text-decoration:underline}

footer{background:var(--wood-dark);color:var(--stone-light);text-align:center;padding:28px 5vw;font-size:.85rem;border-top:6px solid var(--stone)}

@media (max-width:640px){
  header{background:var(--wood-dark)}
  .report-box{grid-template-columns:1fr}
  .report-box .wood,.report-box .stone{padding:24px 20px}
}
</style>
</head>
<body>

<header>
  <a class="logo" href="index.html">木と石のあいだ</a>
  <nav aria-label="メイン">
    <ul>
      <li><a href="index.html">トップ</a></li>
      <li><a href="blog.html">ブログ</a></li>
      <li><a href="column.html" aria-current="page">コラム</a></li>
      <li><a href="gallery.html">ギャラリー</a></li>
      <li><a href="about.html">このサイトについて</a></li>
    </ul>
  </nav>
</header>

<div class="page-title">
  <h1>コラム</h1>
  <p>彫刻について調べたことを、テーマごとにまとめています。</p>
</div>

<main>
  <section id="reports">
    <h2>まとめページ</h2>
    <a class="report-box" href="report1.html">
      <div class="wood">
        <span class="tag">まとめ</span>
        <h3>彫刻に関する人物</h3>
      </div>
      <div class="stone">
        <p>彫刻家をはじめ、彫刻にゆかりのある人物をまとめたページです。</p>
        <span class="go">ページを開く →</span>
      </div>
    </a>
  </section>
</main>

<footer>
  <p>&copy; 2026 木と石のあいだ</p>
</footer>

</body>
</html>
